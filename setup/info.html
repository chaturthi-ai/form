<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Create an Account</h1>
        <h6>Fill in the details to register</h6>
<label for="name">Full Name</label><br>
        <input id="name" type="name" placeholder="Your name"><br><br>
        <label for="email">Email Address</label><br>
        <input id="email" type="email" placeholder="your.email@example.com"><br><br>
        <label for="password">Password</label><br>
        <input id="password" type="number" placeholder="........."><br><br>
        <button >Register</button>
        <h6>Already have an account? sign in </h6>
    </form>
    
</body>
</html>
