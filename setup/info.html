<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Create an Account</h1>
        <p>Fill in the details to register</p>
<label for="name">Full Name</label><br>
        <input id="name" type="name" placeholder="Your name"><br><br>
        <label for="email">Email Address</label><br>
        <input id="email" type="email" placeholder="your.email@example.com"><br><br>
        <label for="password">Password</label><br>
        <input id="password" type="text" placeholder="........."><br><br>
        <input type="submit" value="Registration" style="background-color:blue; color:white">
      <p>Already have an account?<p></p> sign in</p>
    </form>
    
</body>
</html>
